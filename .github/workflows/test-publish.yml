name: Test Publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Update Test Releases
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Fetch latest releases
        env:
          DOWNLOADS_BASE_URL: ${{ vars.DOWNLOADS_BASE_URL }}
        run: node scripts/sync-releases.mjs

      - name: Push release update
        run: |
          if git diff --quiet -- releases.json; then
            echo "Releases are already up to date."
            exit 0
          fi

          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git add releases.json
          git commit -m "chore: update test releases"
          git push origin HEAD:test
